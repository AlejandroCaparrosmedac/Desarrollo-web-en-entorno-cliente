<div class="mt-4">
  <h2>Gestor de Tareas</h2>

  <!-- Contador de tareas -->
  <div class="alert alert-info mt-3" role="alert">
    <strong>Total:</strong> {{totalTareas}} tareas |
    <strong>Completadas:</strong> {{tareasCompletadas}} |
    <strong>Pendientes:</strong> {{tareasPendientes}}
  </div>

  <!-- Formulario para agregar tareas -->
  <div class="input-group mb-3">
    <input
      type="text"
      class="form-control"
      [(ngModel)]="nuevaTarea"
      placeholder="Nueva tarea"
      (keyup.enter)="agregarTarea()"
    >
    <button class="btn btn-primary" (click)="agregarTarea()">
      Agregar tarea
    </button>
  </div>

  <!-- Mensaje cuando no hay tareas -->
  @if (tareas.length === 0) {
    <div class="alert alert-warning" role="alert">
      No hay tareas. ¡Agrega una nueva tarea para comenzar!
    </div>
  }

  <!-- Lista de tareas -->
  @if (tareas.length > 0) {
    <ul class="list-group">
      @for (tarea of tareas; track tarea.id) {
        <li class="list-group-item d-flex justify-content-between align-items-center">
          <div class="form-check form-switch">
            <input
              class="form-check-input"
              type="checkbox"
              [checked]="tarea.completada"
              (change)="toggleCompletada(tarea.id)"
              [id]="'tarea-' + tarea.id"
            >
            <label
              class="form-check-label"
              [for]="'tarea-' + tarea.id"
              [class.text-decoration-line-through]="tarea.completada"
              [class.text-muted]="tarea.completada"
            >
              {{tarea.texto}}
            </label>
          </div>
          <button
            class="btn btn-danger btn-sm"
            (click)="eliminarTarea(tarea.id)"
          >
            Eliminar
          </button>
        </li>
      }
    </ul>
  }
</div>
