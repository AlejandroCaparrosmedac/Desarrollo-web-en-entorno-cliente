<div>
  <div class="mb-4">
    <h1 class="h2 mb-1">Gestor de Tareas</h1>
  </div>

  <!-- Formulario para agregar tareas -->
  <div class="input-group mb-4">
    <input type="text" class="form-control" [(ngModel)]="nuevaTarea" placeholder="Escribe una nueva tarea..."
      (keyup.enter)="agregarTarea()">
    <button class="btn btn-primary" (click)="agregarTarea()">
      Agregar
    </button>
  </div>

  <!-- Contador de tareas -->
  <div class="row mb-4">
    <div class="col-md-4">
      <div class="card bg-light border-0">
        <div class="card-body">
          <small class="text-muted d-block">Total</small>
          <h5 class="mb-0">{{totalTareas}}</h5>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card bg-light border-0">
        <div class="card-body">
          <small class="text-muted d-block">Completadas</small>
          <h5 class="mb-0">{{tareasCompletadas}}</h5>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card bg-light border-0">
        <div class="card-body">
          <small class="text-muted d-block">Pendientes</small>
          <h5 class="mb-0">{{tareasPendientes}}</h5>
        </div>
      </div>
    </div>
  </div>

  <!-- Mensaje cuando no hay tareas -->
  @if (tareas.length === 0) {
  <div class="text-center py-5">
    <p class="text-muted">No hay tareas por el momento</p>
    <p class="text-muted small">Agrega una nueva tarea para comenzar</p>
  </div>
  }

  <!-- Lista de tareas -->
  @if (tareas.length > 0) {
  <div class="row">
    <div class="col-lg-12">
      <ul class="list-group list-group-flush">
        @for (tarea of tareas; track tarea.id) {
        <li class="list-group-item d-flex justify-content-between align-items-center py-3">
          <div class="form-check form-switch flex-grow-1">
            <input class="form-check-input" type="checkbox" [checked]="tarea.completada"
              (change)="toggleCompletada(tarea.id)" [id]="'tarea-' + tarea.id">
            <label class="form-check-label" [for]="'tarea-' + tarea.id"
              [class.text-decoration-line-through]="tarea.completada" [class.text-muted]="tarea.completada">
              {{tarea.texto}}
            </label>
          </div>
          <button class="btn btn-outline-danger btn-sm ms-3" (click)="eliminarTarea(tarea.id)" title="Eliminar tarea">
            Eliminar
          </button>
        </li>
        }
      </ul>
    </div>
  </div>
  }
</div>
