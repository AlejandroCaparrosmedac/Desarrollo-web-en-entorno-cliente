<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Promesas</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h2 class="text-center mb-4">Iniciar sesión</h2>
            </div>
            <card class="card-body">

                <form id="loginForm" class="row g-3">
                    <div class="col-md-12">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" id="email" class="form-control" placeholder="test@medac.es">
                    </div>

                    <div class="col-md-12">
                        <label class="form-label">Contraseña</label>
                        <input type="password" id="password" class="form-control" placeholder="1234">
                    </div>

                    <div class="text-center mb-3 d-none" id="spinner">
                        <div class="spinner-border text-primary"></div>
                        <p>Validando credenciales...</p>
                    </div>
                    <div class="col-md-12">
                        <button class="btn btn-primary w-100" type="submit">Iniciar sesión</button>
                    </div>
                    <div class="mt-3 text-center">
                        <p class="text-muted small"><strong>Credenciales de prueba:</strong><br>Usuario: <code>test@medac.es</code><br>Contraseña: <code>1234</code></p>
                    </div>
                </form>
                <div id="alert-container"></div>
            </card>
        </div>
    </div>


    <script>
        function mostrarAlert(mensaje, type) {
            const container = document.getElementById("alert-container");
            container.innerHTML = `<div class="alert alert-${type}">${mensaje}</div>`;
        }

        function promesaLoginFalsa(email, password) {
            return new Promise((resolve, reject) => {
                const delay = Math.random() * 1000 + 1000;

                setTimeout(() => {
                    if (email === "test@medac.es" && password === "1234") {
                        resolve("Login correcto");
                    } else {
                        reject("Credenciales incorrectas");
                    }
                }, delay);
            });
        }

        async function loginServidor(email, password) {
            try {
                const msg = await promesaLoginFalsa(email, password);
                mostrarAlert(msg, "success");
                spinner.classList.toggle("d-none");
            } catch (error) {
                mostrarAlert(error, "danger");
                spinner.classList.toggle("d-none");
            }
        }

        document.getElementById("loginForm").addEventListener("submit", function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value.trim();
            const spinner = document.getElementById("spinner");

            if (email === "" || password === "") {
                mostrarAlert("Por favor rellene todos los campos.", "danger");
                return;
            }
            
            spinner.classList.toggle("d-none");
            mostrarAlert("", "");

            loginServidor(email, password);
            
            
            
        });
    </script>

</body>

</html>
